[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ykt-case"
version = "0.1.0"
description = "Financial statement extraction and disclosure-note linking case study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tqdm==4.70.1"]

[project.optional-dependencies]
semantic = ["fastembed==0.9.0"]

[project.scripts]
ykt-case = "ykt_case.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
